<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <style>
    .t{font-family:'DejaVu Sans',sans-serif;fill:#071d33}.title{font-size:49px;font-weight:900}.sub{font-size:16px;font-weight:800}.author{font-size:12px;font-weight:700;fill:#284f6b}.sec{font-size:18px;font-weight:900}.h{font-size:13px;font-weight:900}.b{font-size:10.5px;font-weight:700}.s{font-size:9px;font-weight:650}.q{font-size:15px;font-weight:900}.num{font-size:17px;font-weight:900;fill:#fff}.direct{paint-order:stroke fill;stroke:#071d33;stroke-width:.3px;stroke-linejoin:round}
    .wash{fill:#fffdf8;fill-opacity:.95}.wash2{fill:#f5fbff;fill-opacity:.96}.rule{stroke:#4a94b5;stroke-width:2}.badge{fill:#1e5f83}.muted{fill:#31566d}
  </style>
  <rect class="wash" x="172" y="24" width="680" height="166"/>
  <text class="t title direct" x="512" y="89" text-anchor="middle">THE BEGINNING OF INFINITY</text>
  <text class="t sub direct" x="512" y="128" text-anchor="middle">EXPLANATIONS THAT TRANSFORM THE WORLD</text>
  <text class="t author direct" x="512" y="162" text-anchor="middle">DAVID DEUTSCH · 2011</text>

  <rect class="wash2" x="0" y="225" width="1024" height="74"/>
  <circle class="badge" cx="32" cy="252" r="22"/><text class="t num" x="32" y="259" text-anchor="middle">1</text>
  <text class="t sec direct" x="68" y="259">CORE QUESTION</text><line class="rule" x1="223" y1="252" x2="995" y2="252"/>
  <text class="t q direct" x="512" y="289" text-anchor="middle">How can humans correct error and begin unbounded progress?</text>
  <rect class="wash" x="42" y="366" width="940" height="62"/>
  <text class="t h direct" x="180" y="393" text-anchor="middle">PROBLEM</text><text class="t h direct" x="512" y="393" text-anchor="middle">GOOD EXPLANATION</text><text class="t h direct" x="846" y="393" text-anchor="middle">TRANSFORMED WORLD</text>
  <text class="t s direct" x="180" y="414" text-anchor="middle">A conflict reveals flawed knowledge</text><text class="t s direct" x="512" y="414" text-anchor="middle">Creative conjectures face criticism</text><text class="t s direct" x="846" y="414" text-anchor="middle">Better knowledge opens possibilities</text>

  <rect class="wash2" x="0" y="445" width="1024" height="65"/>
  <circle class="badge" cx="32" cy="472" r="22"/><text class="t num" x="32" y="479" text-anchor="middle">2</text>
  <text class="t sec direct" x="68" y="479">BOOK MAP · 18 CHAPTERS</text><text class="t s muted" x="332" y="479">reader's grouping, not official parts</text><line class="rule" x1="537" y1="472" x2="995" y2="472"/>
  <rect class="wash" x="0" y="554" width="1024" height="87"/>
  <text class="t h direct" x="128" y="579" text-anchor="middle">CH. 1–5</text><text class="t b direct" x="128" y="600" text-anchor="middle">EXPLANATION &amp; REALITY</text><text class="t s direct" x="128" y="620" text-anchor="middle">Beyond appearances</text>
  <text class="t h direct" x="384" y="579" text-anchor="middle">CH. 6–8</text><text class="t b direct" x="384" y="600" text-anchor="middle">UNIVERSALITY &amp; CREATIVITY</text><text class="t s direct" x="384" y="620" text-anchor="middle">A jump in reach</text>
  <text class="t h direct" x="640" y="579" text-anchor="middle">CH. 9–14</text><text class="t b direct" x="640" y="600" text-anchor="middle">OPTIMISM · CHOICE · MULTIVERSE</text><text class="t s direct" x="640" y="620" text-anchor="middle">Knowledge and decisions</text>
  <text class="t h direct" x="896" y="579" text-anchor="middle">CH. 15–18</text><text class="t b direct" x="896" y="600" text-anchor="middle">CULTURE &amp; OPEN PROGRESS</text><text class="t s direct" x="896" y="620" text-anchor="middle">From stasis to creation</text>

  <rect class="wash2" x="0" y="650" width="1024" height="58"/>
  <circle class="badge" cx="32" cy="676" r="22"/><text class="t num" x="32" y="683" text-anchor="middle">3</text>
  <text class="t sec direct" x="68" y="683">THE ENGINE OF KNOWLEDGE</text><line class="rule" x1="335" y1="676" x2="995" y2="676"/>
  <text class="t h direct" x="200" y="752" text-anchor="middle">PROBLEM</text><text class="t h direct" x="510" y="721" text-anchor="middle">CREATIVE CONJECTURE</text><text class="t h direct" x="820" y="752" text-anchor="middle">CRITICISM &amp; TEST</text>
  <text class="t h direct" x="820" y="916" text-anchor="middle">ERROR CORRECTION</text><text class="t h direct" x="510" y="966" text-anchor="middle">BETTER EXPLANATION</text><text class="t h direct" x="200" y="916" text-anchor="middle">NEW PROBLEM</text>
  <rect class="wash" x="300" y="814" width="424" height="82"/>
  <text class="t q direct" x="512" y="845" text-anchor="middle">Progress is not a pile of final answers.</text><text class="t q direct" x="512" y="872" text-anchor="middle">It is an open process of finding and correcting error.</text>

  <rect class="wash2" x="0" y="1000" width="1024" height="58"/>
  <circle class="badge" cx="32" cy="1026" r="22"/><text class="t num" x="32" y="1033" text-anchor="middle">4</text>
  <text class="t sec direct" x="68" y="1033">FIVE KEY PERSPECTIVES</text><line class="rule" x1="309" y1="1026" x2="995" y2="1026"/>
  <rect class="wash" x="15" y="1060" width="994" height="82"/>
  <text class="t h direct" x="112" y="1087" text-anchor="middle">GOOD EXPLANATIONS</text><text class="t s direct" x="112" y="1108" text-anchor="middle">Hard to vary while</text><text class="t s direct" x="112" y="1127" text-anchor="middle">still doing their job</text>
  <text class="t h direct" x="310" y="1087" text-anchor="middle">UNIVERSALITY</text><text class="t s direct" x="310" y="1108" text-anchor="middle">A limited system jumps</text><text class="t s direct" x="310" y="1127" text-anchor="middle">to a whole domain</text>
  <text class="t h direct" x="512" y="1087" text-anchor="middle">OPTIMISM</text><text class="t s direct" x="512" y="1108" text-anchor="middle">Problems are inevitable;</text><text class="t s direct" x="512" y="1127" text-anchor="middle">solutions require knowledge</text>
  <text class="t h direct" x="714" y="1087" text-anchor="middle">CREATIVE CULTURE</text><text class="t s direct" x="714" y="1108" text-anchor="middle">Criticism and change</text><text class="t s direct" x="714" y="1127" text-anchor="middle">accelerate knowledge</text>
  <text class="t h direct" x="912" y="1087" text-anchor="middle">MULTIVERSE</text><text class="t s direct" x="912" y="1108" text-anchor="middle">Quantum reality is larger</text><text class="t s direct" x="912" y="1127" text-anchor="middle">than one history</text>
  <rect class="wash" x="190" y="1238" width="644" height="70"/>
  <text class="t q direct" x="512" y="1267" text-anchor="middle">A WORKING ATTITUDE</text><text class="t b direct" x="512" y="1292" text-anchor="middle">Criticism over authority · explanation over prediction · correction over stasis</text>

  <rect class="wash2" x="0" y="1330" width="1024" height="74"/>
  <circle class="badge" cx="32" cy="1356" r="22"/><text class="t num" x="32" y="1363" text-anchor="middle">5</text>
  <text class="t sec direct" x="68" y="1363">QUESTION WHILE READING</text><line class="rule" x1="337" y1="1356" x2="995" y2="1356"/>
  <text class="t q direct" x="512" y="1391" text-anchor="middle">What does this explanation illuminate—and what change would make it fail?</text>
  <rect class="wash" x="112" y="1455" width="800" height="58"/>
  <text class="t h direct" x="512" y="1481" text-anchor="middle">Problems are inevitable. Problems are soluble—when the right knowledge is created.</text>
  <text class="t s direct" x="512" y="1503" text-anchor="middle">We have not reached an endpoint. We are at the beginning of infinity.</text>
</svg>
