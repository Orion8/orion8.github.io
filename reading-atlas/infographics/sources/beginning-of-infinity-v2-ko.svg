<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <style>
    .t{font-family:'Noto Sans KR',sans-serif;fill:#071d33}.title{font-family:'DejaVu Sans',sans-serif;font-size:48px;font-weight:900}.kt{font-size:30px;font-weight:900}.sub{font-size:15px;font-weight:700}.author{font-size:12px;font-weight:700;fill:#284f6b}.sec{font-size:19px;font-weight:900}.h{font-size:14px;font-weight:900}.b{font-size:11px;font-weight:700}.s{font-size:9.5px;font-weight:650}.q{font-size:16px;font-weight:900}.num{font-size:17px;font-weight:900;fill:#fff}.direct{paint-order:stroke fill;stroke:#071d33;stroke-width:.85px;stroke-linejoin:round}
    .wash{fill:#fffdf8;fill-opacity:.95}.wash2{fill:#f5fbff;fill-opacity:.96}.rule{stroke:#4a94b5;stroke-width:2}.badge{fill:#1e5f83}.accent{fill:#b84127}.muted{fill:#31566d}
  </style>
  <rect class="wash" x="214" y="24" width="596" height="166"/>
  <text class="t title direct" x="512" y="78" text-anchor="middle">The Beginning of Infinity</text>
  <text class="t kt direct" x="512" y="121" text-anchor="middle">무한의 시작</text>
  <text class="t sub direct" x="512" y="151" text-anchor="middle">좋은 설명이 세계를 바꾸고 진보를 여는 방식</text>
  <text class="t author direct" x="512" y="176" text-anchor="middle">데이비드 도이치 · 2011</text>

  <rect class="wash2" x="0" y="225" width="1024" height="74"/>
  <circle class="badge" cx="32" cy="252" r="22"/><text class="t num" x="32" y="259" text-anchor="middle">1</text>
  <text class="t sec direct" x="68" y="259">핵심 질문</text><line class="rule" x1="175" y1="252" x2="995" y2="252"/>
  <text class="t q direct" x="512" y="289" text-anchor="middle">인간은 어떻게 오류를 고치며 끝없는 진보를 시작하는가?</text>
  <rect class="wash" x="42" y="366" width="940" height="62"/>
  <text class="t h direct" x="180" y="393" text-anchor="middle">문제</text><text class="t h direct" x="512" y="393" text-anchor="middle">좋은 설명</text><text class="t h direct" x="846" y="393" text-anchor="middle">세계의 변형</text>
  <text class="t s direct" x="180" y="414" text-anchor="middle">모순은 지식의 결함을 드러낸다</text><text class="t s direct" x="512" y="414" text-anchor="middle">창조한 추측을 비판으로 시험한다</text><text class="t s direct" x="846" y="414" text-anchor="middle">더 나은 지식이 새 가능성을 만든다</text>

  <rect class="wash2" x="0" y="445" width="1024" height="65"/>
  <circle class="badge" cx="32" cy="472" r="22"/><text class="t num" x="32" y="479" text-anchor="middle">2</text>
  <text class="t sec direct" x="68" y="479">책의 구조 · 18장</text><text class="t s muted" x="248" y="479">읽기 지도 — 공식 부(部)가 아닌 편집 구성</text><line class="rule" x1="505" y1="472" x2="995" y2="472"/>
  <rect class="wash" x="0" y="554" width="1024" height="87"/>
  <text class="t h direct" x="128" y="579" text-anchor="middle">1–5장</text><text class="t b direct" x="128" y="600" text-anchor="middle">설명과 실재</text><text class="t s direct" x="128" y="620" text-anchor="middle">관찰 너머의 세계를 설명하기</text>
  <text class="t h direct" x="384" y="579" text-anchor="middle">6–8장</text><text class="t b direct" x="384" y="600" text-anchor="middle">보편성과 창조성</text><text class="t s direct" x="384" y="620" text-anchor="middle">기능의 도약과 무한한 범위</text>
  <text class="t h direct" x="640" y="579" text-anchor="middle">9–14장</text><text class="t b direct" x="640" y="600" text-anchor="middle">낙관·선택·다중우주</text><text class="t s direct" x="640" y="620" text-anchor="middle">지식, 결정, 아름다움의 실재</text>
  <text class="t h direct" x="896" y="579" text-anchor="middle">15–18장</text><text class="t b direct" x="896" y="600" text-anchor="middle">문화와 열린 진보</text><text class="t s direct" x="896" y="620" text-anchor="middle">정체에서 지식 창조 사회로</text>

  <rect class="wash2" x="0" y="650" width="1024" height="58"/>
  <circle class="badge" cx="32" cy="676" r="22"/><text class="t num" x="32" y="683" text-anchor="middle">3</text>
  <text class="t sec direct" x="68" y="683">지식 성장의 엔진</text><line class="rule" x1="252" y1="676" x2="995" y2="676"/>
  <text class="t h direct" x="200" y="752" text-anchor="middle">문제</text><text class="t h direct" x="510" y="721" text-anchor="middle">창조적 추측</text><text class="t h direct" x="820" y="752" text-anchor="middle">비판과 시험</text>
  <text class="t h direct" x="820" y="916" text-anchor="middle">오류 수정</text><text class="t h direct" x="510" y="966" text-anchor="middle">더 나은 설명</text><text class="t h direct" x="200" y="916" text-anchor="middle">새로운 문제</text>
  <rect class="wash" x="300" y="814" width="424" height="82"/>
  <text class="t q direct" x="512" y="845" text-anchor="middle">진보는 정답의 축적이 아니라</text><text class="t q direct" x="512" y="872" text-anchor="middle">오류를 발견하고 고치는 열린 과정이다</text>

  <rect class="wash2" x="0" y="1000" width="1024" height="58"/>
  <circle class="badge" cx="32" cy="1026" r="22"/><text class="t num" x="32" y="1033" text-anchor="middle">4</text>
  <text class="t sec direct" x="68" y="1033">다섯 가지 핵심 관점</text><line class="rule" x1="281" y1="1026" x2="995" y2="1026"/>
  <rect class="wash" x="15" y="1060" width="994" height="82"/>
  <text class="t h direct" x="112" y="1087" text-anchor="middle">좋은 설명</text><text class="t s direct" x="112" y="1108" text-anchor="middle">임의로 바꾸기 어렵다</text><text class="t s direct" x="112" y="1127" text-anchor="middle">현상을 깊게 연결한다</text>
  <text class="t h direct" x="310" y="1087" text-anchor="middle">보편성의 도약</text><text class="t s direct" x="310" y="1108" text-anchor="middle">제한된 체계가 어느 순간</text><text class="t s direct" x="310" y="1127" text-anchor="middle">한 영역 전체를 다룬다</text>
  <text class="t h direct" x="512" y="1087" text-anchor="middle">낙관주의</text><text class="t s direct" x="512" y="1108" text-anchor="middle">문제는 피할 수 없지만</text><text class="t s direct" x="512" y="1127" text-anchor="middle">올바른 지식으로 풀 수 있다</text>
  <text class="t h direct" x="714" y="1087" text-anchor="middle">창의적 문화</text><text class="t s direct" x="714" y="1108" text-anchor="middle">비판과 변화를 허용할 때</text><text class="t s direct" x="714" y="1127" text-anchor="middle">지식은 빠르게 성장한다</text>
  <text class="t h direct" x="912" y="1087" text-anchor="middle">다중우주</text><text class="t s direct" x="912" y="1108" text-anchor="middle">양자 현실은 한 갈래보다</text><text class="t s direct" x="912" y="1127" text-anchor="middle">더 크고 풍부하다</text>
  <rect class="wash" x="190" y="1238" width="644" height="70"/>
  <text class="t q direct" x="512" y="1267" text-anchor="middle">핵심 태도</text><text class="t b direct" x="512" y="1292" text-anchor="middle">권위보다 비판 · 예측보다 설명 · 정체보다 오류 수정</text>

  <rect class="wash2" x="0" y="1330" width="1024" height="74"/>
  <circle class="badge" cx="32" cy="1356" r="22"/><text class="t num" x="32" y="1363" text-anchor="middle">5</text>
  <text class="t sec direct" x="68" y="1363">읽으며 던질 질문</text><line class="rule" x1="250" y1="1356" x2="995" y2="1356"/>
  <text class="t q direct" x="512" y="1391" text-anchor="middle">이 설명은 무엇을 밝히며, 어느 부분을 바꾸면 설명력이 무너지는가?</text>
  <rect class="wash" x="112" y="1455" width="800" height="58"/>
  <text class="t h direct" x="512" y="1481" text-anchor="middle">문제는 필연적이다. 그러나 올바른 지식을 만들면 문제는 풀 수 있다.</text>
  <text class="t s direct" x="512" y="1503" text-anchor="middle">우리는 완성점에 도착한 것이 아니라, 무한의 시작에 서 있다.</text>
</svg>
