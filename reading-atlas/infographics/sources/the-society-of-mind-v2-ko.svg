<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1536" viewBox="0 0 1024 1536">
  <image x="0" y="0" width="1024" height="1536" xlink:href="the-society-of-mind-v2-base.png"/>
  <style>
    .t{font-family:'Noto Sans KR',sans-serif;fill:#071d33}.title{font-family:'DejaVu Sans',sans-serif;font-size:53px;font-weight:900}.kt{font-size:31px;font-weight:900}.sub{font-size:16px;font-weight:800}.author{font-size:13px;font-weight:700;fill:#284f6b}.sec{font-size:21px;font-weight:900}.h{font-size:15px;font-weight:900}.b{font-size:12.5px;font-weight:700}.s{font-size:11px;font-weight:650}.q{font-size:17px;font-weight:900}.num{font-size:18px;font-weight:900;fill:#fff}.wash{fill:#fffdf8;fill-opacity:.94}.wash2{fill:#f4fbff;fill-opacity:.95}.rule{stroke:#2c7895;stroke-width:2.5}.badge{fill:#175f7c}
  </style>
  <rect class="wash" x="40" y="18" width="944" height="182"/>
  <text class="t title" x="512" y="75" text-anchor="middle">THE SOCIETY OF MIND</text>
  <text class="t kt" x="512" y="119" text-anchor="middle">마음의 사회</text>
  <text class="t sub" x="512" y="153" text-anchor="middle">생각하지 못하는 작은 과정들이 지능을 만드는 방식</text>
  <text class="t author" x="512" y="181" text-anchor="middle">마빈 민스키 · 1986</text>

  <rect class="wash2" x="0" y="330" width="1024" height="64"/>
  <circle class="badge" cx="34" cy="360" r="23"/><text class="t num" x="34" y="367" text-anchor="middle">1</text>
  <text class="t sec" x="72" y="367">핵심 질문</text><line class="rule" x1="176" y1="360" x2="992" y2="360"/>
  <rect class="wash" x="82" y="406" width="860" height="76"/>
  <text class="t q" x="512" y="437" text-anchor="middle">스스로는 지능이 없는 작은 과정들로부터</text>
  <text class="t q" x="512" y="463" text-anchor="middle">어떻게 하나의 지능이 나타날 수 있을까?</text>

  <rect class="wash2" x="0" y="497" width="1024" height="61"/>
  <circle class="badge" cx="34" cy="525" r="23"/><text class="t num" x="34" y="532" text-anchor="middle">2</text>
  <text class="t sec" x="72" y="532">책의 구조 · 30개 주제 장</text><line class="rule" x1="332" y1="525" x2="992" y2="525"/>
  <rect class="wash" x="16" y="676" width="992" height="112"/>
  <text class="t h" x="112" y="704" text-anchor="middle">1–7장</text><text class="t b" x="112" y="728" text-anchor="middle">마음 세우기</text><text class="t s" x="112" y="752" text-anchor="middle">에이전트 · 부분 · 갈등</text><text class="t s" x="112" y="772" text-anchor="middle">자아 · 목표</text>
  <text class="t h" x="312" y="704" text-anchor="middle">8–13장</text><text class="t b" x="312" y="728" text-anchor="middle">기억과 학습</text><text class="t s" x="312" y="752" text-anchor="middle">K-line · 요약</text><text class="t s" x="312" y="772" text-anchor="middle">의미 · 표상</text>
  <text class="t h" x="512" y="704" text-anchor="middle">14–17장</text><text class="t b" x="512" y="728" text-anchor="middle">내면의 작동</text><text class="t s" x="512" y="752" text-anchor="middle">의식 · 기억 · 감정</text><text class="t s" x="512" y="772" text-anchor="middle">발달</text>
  <text class="t h" x="712" y="704" text-anchor="middle">18–26장</text><text class="t b" x="712" y="728" text-anchor="middle">사고와 언어</text><text class="t s" x="712" y="752" text-anchor="middle">추론 · 단어 · 프레임</text><text class="t s" x="712" y="772" text-anchor="middle">이야기 · 문법</text>
  <text class="t h" x="912" y="704" text-anchor="middle">27–30장</text><text class="t b" x="912" y="728" text-anchor="middle">통제와 모형</text><text class="t s" x="912" y="752" text-anchor="middle">검열자 · 사고 영역</text><text class="t s" x="912" y="772" text-anchor="middle">세계·자아 모형</text>

  <rect class="wash2" x="0" y="795" width="1024" height="62"/>
  <circle class="badge" cx="34" cy="824" r="23"/><text class="t num" x="34" y="831" text-anchor="middle">3</text>
  <text class="t sec" x="72" y="831">핵심 모델</text><line class="rule" x1="181" y1="824" x2="992" y2="824"/>
  <rect class="wash" x="22" y="870" width="980" height="68"/>
  <text class="t h" x="130" y="900" text-anchor="middle">단순 에이전트</text><text class="t h" x="380" y="900" text-anchor="middle">에이전시</text><text class="t h" x="640" y="900" text-anchor="middle">경쟁과 통제</text><text class="t h" x="897" y="900" text-anchor="middle">조정된 행동</text>
  <text class="t s" x="130" y="924" text-anchor="middle">각자 한 가지 작은 일을 한다</text><text class="t s" x="380" y="924" text-anchor="middle">여럿이 능력을 결합한다</text><text class="t s" x="640" y="924" text-anchor="middle">비평자가 선택하고 억제한다</text><text class="t s" x="897" y="924" text-anchor="middle">전체 지능이 나타난다</text>
  <rect class="wash" x="130" y="1051" width="764" height="69"/>
  <text class="t q" x="512" y="1081" text-anchor="middle">어떤 에이전트도 전체를 이해하지 않는다.</text>
  <text class="t b" x="512" y="1107" text-anchor="middle">제한된 과정들의 조직 방식이 유연한 지능을 만든다.</text>

  <rect class="wash2" x="0" y="1128" width="1024" height="62"/>
  <circle class="badge" cx="34" cy="1157" r="23"/><text class="t num" x="34" y="1164" text-anchor="middle">4</text>
  <text class="t sec" x="72" y="1164">네 가지 작동 원리</text><line class="rule" x1="278" y1="1157" x2="992" y2="1157"/>
  <rect class="wash" x="8" y="1265" width="1008" height="105"/>
  <text class="t h" x="128" y="1292" text-anchor="middle">K-LINE · 기억</text><text class="t s" x="128" y="1316" text-anchor="middle">회상은 과거의 유용한</text><text class="t s" x="128" y="1337" text-anchor="middle">에이전트 연합을 다시 켠다.</text>
  <text class="t h" x="384" y="1292" text-anchor="middle">프레임 · 기대</text><text class="t s" x="384" y="1316" text-anchor="middle">상황의 틀이 역할을 채우고</text><text class="t s" x="384" y="1337" text-anchor="middle">합리적인 기본값을 준다.</text>
  <text class="t h" x="640" y="1292" text-anchor="middle">검열자 · 통제</text><text class="t s" x="640" y="1316" text-anchor="middle">어떤 에이전트는 계획을 켜고</text><text class="t s" x="640" y="1337" text-anchor="middle">다른 것은 나쁜 계획을 막는다.</text>
  <text class="t h" x="896" y="1292" text-anchor="middle">자아 · 연합</text><text class="t s" x="896" y="1316" text-anchor="middle">하나의 지배자가 아니라</text><text class="t s" x="896" y="1337" text-anchor="middle">겹친 목표들이 연속성을 만든다.</text>

  <rect class="wash2" x="0" y="1378" width="1024" height="62"/>
  <circle class="badge" cx="34" cy="1407" r="23"/><text class="t num" x="34" y="1414" text-anchor="middle">5</text>
  <text class="t sec" x="72" y="1414">이 책에서 캐갈 관점</text><line class="rule" x1="307" y1="1407" x2="992" y2="1407"/>
  <rect class="wash" x="22" y="1445" width="980" height="84"/>
  <text class="t b" x="180" y="1471" text-anchor="middle">전문가를 찾아라</text><text class="t s" x="180" y="1493" text-anchor="middle">지능을 작은 일들로 나눈다.</text>
  <text class="t b" x="512" y="1471" text-anchor="middle">통제를 찾아라</text><text class="t s" x="512" y="1493" text-anchor="middle">무엇이 켜고, 다투고, 막는지 묻는다.</text>
  <text class="t b" x="844" y="1471" text-anchor="middle">읽으며 던질 질문</text><text class="t s" x="844" y="1493" text-anchor="middle">이 생각은 어떤 연합이 만들었을까?</text>
  <text class="t s" x="512" y="1520" text-anchor="middle">마음은 군주보다 끊임없이 진화하는 조직에 가깝다.</text>
</svg>
