<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MomentAtlas 출시 디자인 콘셉트</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f5f7; color: #202632; }
    header { padding: 28px 20px 18px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 34px); }
    header p { margin: 0; color: #667085; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px; max-width: 1320px; margin: 0 auto; padding: 20px; align-items: start; }
    article { background: white; border-radius: 20px; padding: 14px; box-shadow: 0 8px 30px #1b263614; }
    h2 { margin: 2px 4px 10px; font-size: 19px; }
    a { color: inherit; }
    img { display: block; width: 100%; height: auto; border-radius: 12px; }
    .note { margin: 10px 4px 2px; color: #667085; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>MomentAtlas 출시 디자인 콘셉트</h1>
    <p>화면 시안 3종 · 이미지를 누르면 크게 볼 수 있습니다.</p>
  </header>
  <main>
    <article>
      <h2>1. 에디토리얼 지도</h2>
      <a href="editorial-atlas.png"><img src="editorial-atlas.png" alt="밝은 종이 질감의 세로 타임라인과 여백 중심 이벤트 카드" loading="eager"></a>
      <p class="note">차분한 여백과 타이포그래피 중심</p>
    </article>
    <article>
      <h2>2. 빛의 아틀라스</h2>
      <a href="luminous-atlas.png"><img src="luminous-atlas.png" alt="짙은 남색 배경의 빛나는 시간축과 양쪽 이벤트" loading="lazy"></a>
      <p class="note">시간의 깊이와 이벤트 연결 강조</p>
    </article>
    <article>
      <h2>3. 살아 있는 철로</h2>
      <a href="living-railway.png"><img src="living-railway.png" alt="철로 위 작은 기관차와 구간별 날씨가 있는 시간 지도" loading="lazy"></a>
      <p class="note">기관차와 날씨를 공간적으로 표현</p>
    </article>
  </main>
</body>
</html>
