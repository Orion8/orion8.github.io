name: Collect MomentAtlas news

on:
  schedule:
    # User-selected local times, DST-aware. Actions can still delay delivery.
    - cron: '0 6,18 * * *'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate RSS and AI output without publishing files'
        required: false
        default: false
        type: boolean
      slot_id:
        description: 'Pacific slot (YYYY-MM-DD/06:00 or YYYY-MM-DD/18:00); guarded mode only'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: time-map-news-catalog
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify model routing and collection safeguards
        run: node --test tools/news/*.test.mjs

      - name: Require the OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo 'OPENAI_API_KEY is not configured. Add it in Settings > Secrets and variables > Actions.'
            exit 1
          }

      - name: Collect, cluster, validate, and write news events
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_SLOT_GUARD_TOKEN: ${{ secrets.NEWS_SLOT_GUARD_TOKEN }}
          NEWS_EXECUTION_MODE: ${{ vars.TIME_MAP_NEWS_EXECUTION_MODE }}
          NEWS_SLOT_ID: ${{ inputs.slot_id }}
          # Model names are repository Variables, not Secrets.
          OPENAI_TRIAGE_MODEL: ${{ vars.TIME_MAP_NEWS_TRIAGE_MODEL || 'gpt-6-luna' }}
          OPENAI_EDITOR_MODEL: ${{ vars.TIME_MAP_NEWS_EDITOR_MODEL || 'gpt-6-luna' }}
          NEWS_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          NEWS_MAX_AGE_DAYS: '21'
          NEWS_RETENTION_DAYS: '30'
          # Keep one publisher from dominating a single editorial batch.
          NEWS_MAX_ARTICLES_PER_PUBLISHER: '3'
          # Keep the public, 30-day catalog balanced as well.
          NEWS_MAX_EVENTS_PER_PUBLISHER: '6'
          # A single publication cannot introduce a stream of one field.
          NEWS_MAX_NEW_EVENTS_PER_CATEGORY: '2'
          # AI and broader technology share this category but retain separate
          # topic filters, so leave room for both in the 30-day timeline.
          NEWS_MAX_EVENTS_PER_CATEGORY: '12'
          # Application-level admission limits, not a billing-account dollar cap.
          NEWS_MAX_AI_CALLS: '2'
          NEWS_MAX_RUN_TOKENS: '150000'
          NEWS_MAX_AI_INPUT_BYTES: '100000'
          NEWS_TRIAGE_MAX_OUTPUT_TOKENS: '2000'
          NEWS_EDITOR_MAX_OUTPUT_TOKENS: '12000'
          NEWS_AI_TIMEOUT_MS: '90000'
          NEWS_RSS_TIMEOUT_MS: '12000'
          NEWS_RUN_TIMEOUT_MS: '480000'
        run: node tools/news/collect_news.mjs

      - name: Commit updated catalog
        if: ${{ success() && !inputs.dry_run }}
        run: |
          git add cdx_time_map/catalog/news_events.json cdx_time_map/catalog/news_events_manifest.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update MomentAtlas news catalog'
          git push
