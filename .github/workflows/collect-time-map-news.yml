name: Collect Time Map news

on:
  schedule:
    # 06:07 and 18:07 Pacific Daylight Time (UTC-7). GitHub cron uses UTC.
    # Seven minutes past the hour avoids the busiest GitHub schedule window.
    # Move these to 14:07 and 02:07 UTC when Pacific Standard Time resumes.
    - cron: '7 1,13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate RSS and AI output without publishing files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: time-map-news-catalog
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require the OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo 'OPENAI_API_KEY is not configured. Add it in Settings > Secrets and variables > Actions.'
            exit 1
          }

      - name: Collect, cluster, validate, and write news events
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Model names are repository Variables, not Secrets.
          OPENAI_TRIAGE_MODEL: ${{ vars.TIME_MAP_NEWS_TRIAGE_MODEL || 'gpt-5-nano' }}
          OPENAI_EDITOR_MODEL: ${{ vars.TIME_MAP_NEWS_EDITOR_MODEL || 'gpt-5-mini' }}
          NEWS_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          NEWS_MAX_AGE_DAYS: '21'
          NEWS_RETENTION_DAYS: '30'
          # Keep one publisher from dominating a single editorial batch.
          NEWS_MAX_ARTICLES_PER_PUBLISHER: '3'
          # Keep the public, 30-day catalog balanced as well.
          NEWS_MAX_EVENTS_PER_PUBLISHER: '6'
        run: node tools/news/collect_news.mjs

      - name: Commit updated catalog
        if: ${{ !inputs.dry_run }}
        run: |
          git add cdx_time_map/catalog/news_events.json cdx_time_map/catalog/news_events_manifest.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Time Map news catalog'
          git push
