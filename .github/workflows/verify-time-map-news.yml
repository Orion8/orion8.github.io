name: Verify MomentAtlas news safeguards

on:
  push:
    paths:
      - 'tools/news/**'
      - 'tools/operations/**'
      - '.github/workflows/monitor-time-map-automation.yml'
      - '.github/workflows/collect-time-map-news.yml'
      - '.github/workflows/verify-time-map-news.yml'
  pull_request:
    paths:
      - 'tools/news/**'
      - 'tools/operations/**'
      - '.github/workflows/monitor-time-map-automation.yml'
      - '.github/workflows/collect-time-map-news.yml'
      - '.github/workflows/verify-time-map-news.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safeguards:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Synthetic fixtures only. No API secret, paid request or publication.
      - run: node --test tools/news/*.test.mjs
      - run: node --test tools/operations/*.test.mjs
      - run: node --check tools/news/collect_news.mjs
